# =============================================================================
# eBill — Legacy VPS Deploy (build-on-server)
# =============================================================================
# ⚠️  AUTO-TRIGGER DISABLED — superseded by docker-build-push.yml
#
# docker-build-push.yml is the active CI/CD pipeline:
#   Push → GitHub Actions builds images → Docker Hub → VPS pulls & runs
#
# This workflow is kept for MANUAL use only (e.g. emergency re-deploy
# without a new push). Run it from GitHub Actions → Run workflow.
#
# Secrets required (if running manually):
#   DEPLOY_HOST      — VPS IP or hostname
#   DEPLOY_USER      — SSH username (e.g. root)
#   DEPLOY_SSH_KEY   — SSH private key (full content)
#   DEPLOY_PORT      — SSH port (optional, default 22)
#   DEPLOY_PATH      — App path on VPS (optional, default /opt/ebill)
# =============================================================================
name: Deploy (Manual Only)

on:
  workflow_dispatch:    # Manual trigger only — push trigger removed to prevent double deployment

jobs:
  deploy:
    name: Build & Deploy on VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          port:     ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/opt/ebill' }}

            echo ">>> Pulling latest code..."
            git pull origin live

            echo ">>> Building and starting services..."
            DOCKER_BUILDKIT=1 docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo ">>> Cleaning up old images..."
            docker image prune -f

            echo ">>> Done!"
