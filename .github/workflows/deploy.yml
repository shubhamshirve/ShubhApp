# =============================================================================
# eBill — Lightweight CI/CD (build-on-VPS fallback)
# This workflow is a fallback for direct VPS builds when pre-built GHCR images
# are not available. Prefer docker-build-push.yml for production deployments.
# =============================================================================
name: Deploy (VPS Build)

on:
  workflow_dispatch:   # Manual trigger only — not on push

jobs:
  deploy:
    name: Build & Deploy on VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          port:     ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/root/ebill' }}

            # Ensure dbbackups directory exists
            mkdir -p dbbackups

            echo ">>> Pulling latest code..."
            git pull origin live

            echo ">>> Building and starting services (BuildKit enabled)..."
            DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1 \
              docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo ">>> Cleaning up old images..."
            docker image prune -f

            echo ">>> Done!"
