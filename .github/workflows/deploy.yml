# =============================================================================
# eBill — GitHub Actions CI/CD Pipeline (GHCR + npm)
# Triggers: Push to 'live' branch → Lint → Parallel Build → SSH Deploy to VPS
#
# Required GitHub Secrets:
#   CR_PAT              - GitHub PAT with read:packages (for VPS docker pull)
#   DEPLOY_HOST         - VPS IP / hostname
#   DEPLOY_USER         - SSH username
#   DEPLOY_SSH_KEY      - SSH private key
#   DEPLOY_PORT         - SSH port (optional, default 22)
#   DEPLOY_PATH         - App directory on VPS (optional, default /opt/ebill)
#   REACT_APP_BACKEND_URL - Production API URL
# =============================================================================
name: CI/CD Deploy

on:
  push:
    branches: [live]
  pull_request:
    branches: [live]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: shubhamshirve/shubhapp
  NODE_VERSION: '20'

jobs:
  # ── Lint & Validate ─────────────────────────────────────────────────────────
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint --if-present || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt -q

      - name: Lint backend
        working-directory: backend
        run: |
          pip install ruff -q
          ruff check . --exit-zero

  # ── Build Backend Image (parallel with frontend) ───────────────────────────
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max
          build-args: BUILD_ENV=production

  # ── Build Frontend Image (parallel with backend) ───────────────────────────
  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend-npm
          cache-to:   type=gha,scope=frontend-npm,mode=max
          build-args: |
            REACT_APP_BACKEND_URL=${{ secrets.REACT_APP_BACKEND_URL }}

  # ── Deploy to Production (SSH — Option B) ─────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/live' || github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          port:     ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/opt/ebill' }}

            echo ">>> Pulling latest code from live branch..."
            git pull origin live

            echo ">>> Logging in to GHCR..."
            echo "${{ secrets.CR_PAT }}" | \
              docker login ghcr.io -u shubhamshirve --password-stdin

            echo ">>> Pulling latest images (no build on VPS)..."
            docker pull ghcr.io/${{ env.IMAGE_PREFIX }}-backend:latest
            docker pull ghcr.io/${{ env.IMAGE_PREFIX }}-frontend:latest

            echo ">>> Restarting services..."
            docker compose -f docker-compose.ghcr.yml up -d --no-build --remove-orphans

            echo ">>> Cleaning up old images..."
            docker image prune -f

            echo ">>> Deployment complete!"
