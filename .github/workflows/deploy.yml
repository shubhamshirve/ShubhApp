# =============================================================================
# eBill — CI/CD Pipeline
# Push to 'live' branch → SSH into VPS → git pull → docker compose build & up
#
# GitHub Secrets required:
#   DEPLOY_HOST      — VPS IP or hostname
#   DEPLOY_USER      — SSH username (e.g. root)
#   DEPLOY_SSH_KEY   — SSH private key (full content)
#   DEPLOY_PORT      — SSH port (optional, default 22)
#   DEPLOY_PATH      — App path on VPS (optional, default /opt/ebill)
# =============================================================================
name: Deploy

on:
  push:
    branches: [live]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy on VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          port:     ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/opt/ebill' }}

            echo ">>> Pulling latest code..."
            git pull origin live

            echo ">>> Building and starting services..."
            DOCKER_BUILDKIT=1 docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo ">>> Cleaning up old images..."
            docker image prune -f

            echo ">>> Done!"
