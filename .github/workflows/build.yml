name: Build & Push to Docker Hub

on:
  push:
    branches:
      - develop
      - live
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: docker.io
  
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        run: |
          BRANCH=${{ github.ref_name }}
          SHA=${{ github.sha }}
          SHA_SHORT=${SHA:0:7}
          
          # Build image tags
          BACKEND_TAGS="${{ secrets.DOCKER_USERNAME }}/ebill-backend:${BRANCH},${{ secrets.DOCKER_USERNAME }}/ebill-backend:${SHA_SHORT}"
          FRONTEND_TAGS="${{ secrets.DOCKER_USERNAME }}/ebill-frontend:${BRANCH},${{ secrets.DOCKER_USERNAME }}/ebill-frontend:${SHA_SHORT}"
          
          # Add 'latest' tag for live branch
          if [ "$BRANCH" = "live" ]; then
            BACKEND_TAGS="${BACKEND_TAGS},${{ secrets.DOCKER_USERNAME }}/ebill-backend:latest"
            FRONTEND_TAGS="${FRONTEND_TAGS},${{ secrets.DOCKER_USERNAME }}/ebill-frontend:latest"
          fi
          
          echo "backend_tags=${BACKEND_TAGS}" >> $GITHUB_OUTPUT
          echo "frontend_tags=${FRONTEND_TAGS}" >> $GITHUB_OUTPUT
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.backend_tags }}
          build-args: BUILD_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.frontend_tags }}
          build-args: REACT_APP_BACKEND_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "Backend and Frontend images pushed successfully!"
          echo "Images tagged as: ${{ steps.meta.outputs.backend_tags }}"
          echo "                  ${{ steps.meta.outputs.frontend_tags }}"
          echo "Commit SHA: ${{ steps.meta.outputs.sha_short }}"

  notify-success:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Log success message
        run: |
          echo "✅ Build & Push completed successfully!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Next: Deploy using the deploy workflow or manual script"
