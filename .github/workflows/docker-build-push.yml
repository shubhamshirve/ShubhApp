name: Build & Deploy to Production

on:
  push:
    branches:
      - live
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ebill-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/ebill-backend:${{ github.sha }}
          build-args: BUILD_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ebill-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/ebill-frontend:${{ github.sha }}
          build-args: REACT_APP_BACKEND_URL=${{ secrets.REACT_APP_BACKEND_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          envs: BRANCH_NAME
          command_timeout: 30m
          script: |
            set -e
            APP_DIR="/root/ShubhApp"
            DEPLOY_LOG="$APP_DIR/deploy.log"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            if [ ! -d ".git" ]; then
              echo "Initializing git repository in $APP_DIR..."
              git init
              git remote add origin https://github.com/shubhamshirve/ShubhApp.git
            fi

            echo "Pulling latest code for branch $BRANCH_NAME..."
            git fetch origin "$BRANCH_NAME"
            git reset --hard "origin/$BRANCH_NAME"

            # ---------------------------------------------------------------
            # ENV FILE RESOLUTION
            # Priority: .env.production > .env (in current dir)
            # Fallback: migrate from old /root/ebill location
            # ---------------------------------------------------------------
            resolve_env_file() {
              if [ -s "$APP_DIR/.env.production" ]; then
                echo "$APP_DIR/.env.production"; return 0
              fi
              if [ -s "$APP_DIR/.env" ]; then
                echo "$APP_DIR/.env"; return 0
              fi
              if [ -s "/root/ebill/.env.production" ]; then
                echo "Migrating .env.production from /root/ebill..." >&2
                cp /root/ebill/.env.production "$APP_DIR/.env.production"
                echo "$APP_DIR/.env.production"; return 0
              fi
              if [ -s "/root/ebill/.env" ]; then
                echo "Migrating .env from /root/ebill..." >&2
                cp /root/ebill/.env "$APP_DIR/.env"
                echo "$APP_DIR/.env"; return 0
              fi
              return 1
            }

            ENV_FILE_ABS=$(resolve_env_file) || {
              echo "=========================================================="
              echo "ERROR: No valid environment file found!"
              echo "Please create /root/ShubhApp/.env.production on the server"
              echo "with all required variables. See .env.example for reference."
              echo "Required: DOMAIN, SERVER_IP, MONGO_ROOT_USERNAME, MONGO_ROOT_PASSWORD"
              echo "          JWT_SECRET, BACKUP_PASSWORD, CORS_ORIGINS, REACT_APP_BACKEND_URL"
              echo "=========================================================="
              exit 1
            }

            echo "Using environment file: $ENV_FILE_ABS"

            # Validate required variables are present and non-empty
            MISSING=""
            for VAR in DOMAIN MONGO_ROOT_USERNAME MONGO_ROOT_PASSWORD JWT_SECRET REACT_APP_BACKEND_URL; do
              if ! grep -qE "^${VAR}=.+" "$ENV_FILE_ABS"; then
                MISSING="$MISSING $VAR"
              fi
            done
            if [ -n "$MISSING" ]; then
              echo "WARNING: Missing or empty variables in $ENV_FILE_ABS: $MISSING"
              echo "Deployment may fail or behave unexpectedly."
            fi

            # ---------------------------------------------------------------
            # DOCKER DAEMON: Fix MTU + DNS for VPS networking (runs once)
            # Root cause of TLS handshake timeouts: VPS providers use VXLAN/
            # overlay networking with MTU ~1450 — Docker's default 1500 causes
            # large TLS packets to be fragmented/dropped during image pulls.
            # ---------------------------------------------------------------
            DAEMON_JSON="/etc/docker/daemon.json"
            NEEDS_RESTART=false

            if [ ! -f "$DAEMON_JSON" ] || ! grep -q '"mtu"' "$DAEMON_JSON"; then
              echo ">>> Configuring Docker daemon (MTU=1450 + DNS) for VPS networking..."
              cat > "$DAEMON_JSON" << 'DOCKERCFG'
{
  "dns": ["8.8.8.8", "8.8.4.4"],
  "mtu": 1450,
  "log-driver": "json-file",
  "log-opts": { "max-size": "10m", "max-file": "3" }
}
DOCKERCFG
              NEEDS_RESTART=true
            fi

            if [ "$NEEDS_RESTART" = "true" ]; then
              echo ">>> Restarting Docker daemon to apply new config..."
              systemctl restart docker
              sleep 5
              echo ">>> Docker daemon ready"
            fi

            # ---------------------------------------------------------------
            # PULL images with retry (handles transient TLS timeouts)
            # ---------------------------------------------------------------
            echo ">>> Pulling Docker images (this may take several minutes)..."
            PULL_SUCCESS=false
            for attempt in 1 2 3; do
              echo "    Pull attempt $attempt/3..."
              if docker-compose -f docker-compose.prod.yml --env-file "$ENV_FILE_ABS" pull; then
                PULL_SUCCESS=true
                echo "    Pull succeeded on attempt $attempt"
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "    Pull failed — retrying in 30s..."
                sleep 30
              fi
            done

            if [ "$PULL_SUCCESS" = "false" ]; then
              echo "=========================================================="
              echo "ERROR: All 3 pull attempts failed."
              echo "Check VPS network connectivity to registry-1.docker.io"
              echo "Manual fix: curl -v https://registry-1.docker.io/v2/"
              echo "=========================================================="
              exit 1
            fi

            echo "Stopping old containers..."
            docker-compose -f docker-compose.prod.yml --env-file "$ENV_FILE_ABS" down --remove-orphans

            echo "Starting services..."
            docker-compose -f docker-compose.prod.yml --env-file "$ENV_FILE_ABS" up -d --remove-orphans || {
              echo "=========================================================="
              echo "ERROR: docker-compose up failed. Dumping logs..."
              echo "--- backend logs ---"
              docker-compose -f docker-compose.prod.yml logs --tail=50 backend || true
              echo "--- mongodb logs ---"
              docker-compose -f docker-compose.prod.yml logs --tail=20 mongodb || true
              echo "=========================================================="
              exit 1
            }

            echo "Deployment complete!"
            docker-compose -f docker-compose.prod.yml ps
