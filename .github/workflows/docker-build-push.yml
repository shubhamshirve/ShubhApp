name: Build & Deploy to Production

on:
  push:
    branches:
      - live
      - V7.16.6
      - V8.3
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ebill-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/ebill-backend:${{ github.sha }}
          build-args: BUILD_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ebill-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/ebill-frontend:${{ github.sha }}
          build-args: REACT_APP_BACKEND_URL=${{ secrets.REACT_APP_BACKEND_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push whatsapp-service
        uses: docker/build-push-action@v5
        with:
          context: ./whatsapp-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ebill-whatsapp-webjs:latest
            ${{ secrets.DOCKER_USERNAME }}/ebill-whatsapp-webjs:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          envs: BRANCH_NAME
          script: |
            set -e
            cd /root/ShubhApp

            echo "Pulling latest code for branch $BRANCH_NAME..."
            git fetch origin $BRANCH_NAME
            git reset --hard origin/$BRANCH_NAME

            echo "Pulling Docker images..."
            docker-compose -f docker-compose.prod.yml pull

            echo "Cleaning up old containers..."
            docker-compose -f docker-compose.prod.yml down --remove-orphans

            echo "Restarting services..."
            docker-compose -f docker-compose.prod.yml --env-file .env.production up -d --remove-orphans

            echo "Deployment complete!"
            docker-compose -f docker-compose.prod.yml ps
