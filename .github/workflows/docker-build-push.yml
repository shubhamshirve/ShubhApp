name: Build & Deploy to Production

on:
  push:
    branches:
      - live
  workflow_dispatch:

# Cancel in-progress runs for the same branch (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build backend image ──────────────────────────────────────────────────────
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ebill-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/ebill-backend:${{ github.sha }}
          build-args: BUILD_ENV=production
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ── Build frontend image (runs in parallel with backend) ─────────────────────
  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ebill-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/ebill-frontend:${{ github.sha }}
          build-args: REACT_APP_BACKEND_URL=${{ secrets.REACT_APP_BACKEND_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Deploy: pull pre-built images, no build on VPS ───────────────────────────
  deploy:
    name: Deploy to VPS
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          envs: BRANCH_NAME
          command_timeout: 15m
          script: |
            set -e
            APP_DIR="/root/ShubhApp"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/shubhamshirve/ShubhApp.git
            fi

            echo "Pulling latest code for branch $BRANCH_NAME..."
            git fetch origin "$BRANCH_NAME"
            git reset --hard "origin/$BRANCH_NAME"

            # Ensure dbbackups dir exists on the host (persists across deployments)
            mkdir -p "$APP_DIR/dbbackups"

            # ---------------------------------------------------------------
            # ENV FILE RESOLUTION
            # ---------------------------------------------------------------
            resolve_env_file() {
              if [ -s "$APP_DIR/.env.production" ]; then
                echo "$APP_DIR/.env.production"; return 0
              fi
              if [ -s "$APP_DIR/.env" ]; then
                echo "$APP_DIR/.env"; return 0
              fi
              if [ -s "/root/ebill/.env.production" ]; then
                cp /root/ebill/.env.production "$APP_DIR/.env.production"
                echo "$APP_DIR/.env.production"; return 0
              fi
              if [ -s "/root/ebill/.env" ]; then
                cp /root/ebill/.env "$APP_DIR/.env"
                echo "$APP_DIR/.env"; return 0
              fi
              return 1
            }

            ENV_FILE_ABS=$(resolve_env_file) || {
              echo "ERROR: No valid environment file found!"
              echo "Please create $APP_DIR/.env.production on the server."
              exit 1
            }

            echo "Using environment file: $ENV_FILE_ABS"

            # Validate required vars
            MISSING=""
            for VAR in DOMAIN MONGO_ROOT_USERNAME MONGO_ROOT_PASSWORD JWT_SECRET REACT_APP_BACKEND_URL; do
              if ! grep -qE "^${VAR}=.+" "$ENV_FILE_ABS"; then
                MISSING="$MISSING $VAR"
              fi
            done
            [ -n "$MISSING" ] && echo "WARNING: Missing or empty variables: $MISSING"

            # Pull pre-built images (no build on VPS)
            echo "Pulling Docker images..."
            docker-compose -f docker-compose.prod.yml --env-file "$ENV_FILE_ABS" pull

            echo "Stopping old containers..."
            docker-compose -f docker-compose.prod.yml --env-file "$ENV_FILE_ABS" down --remove-orphans

            echo "Starting services with new images..."
            docker-compose -f docker-compose.prod.yml --env-file "$ENV_FILE_ABS" up -d --remove-orphans || {
              echo "ERROR: docker-compose up failed. Dumping logs..."
              docker-compose -f docker-compose.prod.yml logs --tail=50 backend || true
              docker-compose -f docker-compose.prod.yml logs --tail=20 mongodb || true
              exit 1
            }

            echo "Removing dangling images..."
            docker image prune -f

            echo "Deployment complete!"
            docker-compose -f docker-compose.prod.yml ps
