name: Build & Deploy to Production

on:
  push:
    branches:
      - live
  workflow_dispatch:

# Cancel in-progress runs for the same branch (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build backend image ──────────────────────────────────────────────────────
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ebill-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/ebill-backend:${{ github.sha }}
          build-args: BUILD_ENV=production
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ── Build frontend image (runs in parallel with backend) ─────────────────────
  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ebill-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/ebill-frontend:${{ github.sha }}
          build-args: REACT_APP_BACKEND_URL=${{ secrets.REACT_APP_BACKEND_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Deploy: pull pre-built images, no build on VPS ───────────────────────────
  deploy:
    name: Deploy to VPS
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - name: Write .env.production to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 2m
          script: |
            APP_DIR="${{ secrets.DEPLOY_PATH || '/root/ebill' }}"
            mkdir -p "$APP_DIR"
            ENV_FILE="$APP_DIR/.env.production"

            # Write env file from GitHub Secret (overwrites every deploy so secrets stay in sync)
            cat > "$ENV_FILE" << 'EBILL_ENV_EOF'
            ${{ secrets.DOTENV_PRODUCTION }}
            EBILL_ENV_EOF

            # Strip leading whitespace that heredoc indentation adds
            sed -i 's/^[[:space:]]*//' "$ENV_FILE"
            # Remove blank lines that may appear at top
            sed -i '/^$/d' "$ENV_FILE"
            chmod 600 "$ENV_FILE"
            echo ">>> .env.production written ($(wc -l < $ENV_FILE) lines)"

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: BRANCH_NAME
          command_timeout: 15m
          script: |
            set -e

            # ── Ensure Docker daemon is running ────────────────────────────
            if ! docker info &>/dev/null; then
              echo ">>> Docker daemon not running — starting it..."
              systemctl start docker
              for i in 1 2 3 4 5; do
                sleep 3
                docker info &>/dev/null && break
                echo "    waiting for Docker... ($i/5)"
              done
              docker info &>/dev/null || { echo "ERROR: Docker failed to start!"; exit 1; }
              echo ">>> Docker daemon started"
            fi

            APP_DIR="${{ secrets.DEPLOY_PATH || '/root/ebill' }}"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/shubhamshirve/ShubhApp.git
            fi

            echo ">>> Pulling latest code for branch $BRANCH_NAME..."
            git fetch origin "$BRANCH_NAME"
            git reset --hard "origin/$BRANCH_NAME"

            # Ensure dbbackups dir exists (persists across deployments)
            mkdir -p "$APP_DIR/dbbackups"
            # Ensure e-bill.in website dir exists (static files placed here manually)
            mkdir -p "$APP_DIR/www/e-bill.in"

            # ── Resolve .env file (.env.production > .env) ────────────────
            ENV_FILE_ABS=""
            [ -s "$APP_DIR/.env.production" ] && ENV_FILE_ABS="$APP_DIR/.env.production"
            [ -z "$ENV_FILE_ABS" ] && [ -s "$APP_DIR/.env" ] && ENV_FILE_ABS="$APP_DIR/.env"

            if [ -z "$ENV_FILE_ABS" ]; then
              echo "ERROR: No .env.production or .env found in $APP_DIR!"
              echo "Add DOTENV_PRODUCTION secret to GitHub and re-run."
              exit 1
            fi
            echo ">>> Using env file: $ENV_FILE_ABS"

            # Validate required vars
            MISSING=""
            for VAR in DOMAIN MONGO_ROOT_USERNAME MONGO_ROOT_PASSWORD JWT_SECRET REACT_APP_BACKEND_URL DOCKER_USERNAME; do
              grep -qE "^${VAR}=.+" "$ENV_FILE_ABS" || MISSING="$MISSING $VAR"
            done
            [ -n "$MISSING" ] && echo "WARNING: Missing env vars:$MISSING"

            # ── Pull pre-built images (no build on VPS) ────────────────────
            echo ">>> Pulling latest Docker images from Docker Hub..."
            docker compose -f docker-compose.prod.yml --env-file "$ENV_FILE_ABS" pull

            # ── Stop containers from old/known deploy paths to free up shared resources ──
            # This handles the one-time migration from /root/ShubhApp → /root/ebill
            # and prevents port conflicts if the deploy path ever changes again.
            for OLD_PATH in "/root/ShubhApp" "/root/ShubhApp " "/opt/ebill"; do
              if [ -d "$OLD_PATH" ] && [ "$OLD_PATH" != "$APP_DIR" ]; then
                if [ -f "$OLD_PATH/docker-compose.prod.yml" ]; then
                  echo ">>> Stopping old containers in $OLD_PATH..."
                  cd "$OLD_PATH"
                  OLD_ENV=""
                  [ -s "$OLD_PATH/.env.production" ] && OLD_ENV="--env-file $OLD_PATH/.env.production"
                  [ -z "$OLD_ENV" ] && [ -s "$OLD_PATH/.env" ] && OLD_ENV="--env-file $OLD_PATH/.env"
                  docker compose -f docker-compose.prod.yml $OLD_ENV down --remove-orphans 2>/dev/null || true
                  cd "$APP_DIR"
                fi
              fi
            done

            echo ">>> Stopping old containers..."
            docker compose -f docker-compose.prod.yml --env-file "$ENV_FILE_ABS" down --remove-orphans

            echo ">>> Starting services..."
            docker compose -f docker-compose.prod.yml --env-file "$ENV_FILE_ABS" up -d --remove-orphans || {
              echo "ERROR: docker compose up failed. Dumping logs..."
              docker compose -f docker-compose.prod.yml --env-file "$ENV_FILE_ABS" logs --tail=50 backend || true
              docker compose -f docker-compose.prod.yml --env-file "$ENV_FILE_ABS" logs --tail=20 mongodb || true
              exit 1
            }

            echo ">>> Cleaning up old images..."
            docker image prune -f

            echo ">>> Deployment complete!"
            docker compose -f docker-compose.prod.yml --env-file "$ENV_FILE_ABS" ps
