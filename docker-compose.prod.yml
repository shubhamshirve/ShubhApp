version: '3.8'

services:
  init-env:
    image: alpine:3.20
    container_name: ebill_init_env
    restart: "no"
    working_dir: /app
    environment:
      DOMAIN: ${DOMAIN:-app.e-bill.in}
      SERVER_IP: ${SERVER_IP:-45.196.196.21}
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      BACKUP_PASSWORD: ${BACKUP_PASSWORD}
    command: ["/bin/sh", "/app/docker/init-env.sh", "/app"]
    volumes:
      - ./:/app
    networks:
      - ebill
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M

  mongodb:
    image: mongo:4.4
    container_name: ebill_mongodb
    restart: always
    depends_on:
      init-env:
        condition: service_completed_successfully
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ebill
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 256M

  backend:
    image: ${DOCKER_USERNAME:-teasyservices}/ebill-backend:latest
    container_name: ebill_backend
    restart: always
    depends_on:
      init-env:
        condition: service_completed_successfully
      mongodb:
        condition: service_started
    environment:
      DB_NAME: ${DB_NAME:-saas_db}
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_AUTH_DB: admin
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
    expose:
      - "8000"
    networks:
      - ebill
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 256M
        reservations:
          memory: 128M

  frontend:
    image: ${DOCKER_USERNAME:-teasyservices}/ebill-frontend:latest
    container_name: ebill_frontend
    restart: always
    depends_on:
      init-env:
        condition: service_completed_successfully
      backend:
        condition: service_started
    environment:
      REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
    expose:
      - "3000"
    networks:
      - ebill
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
        reservations:
          memory: 128M

  caddy:
    image: caddy:2.8-alpine
    container_name: ebill_caddy
    restart: always
    depends_on:
      init-env:
        condition: service_completed_successfully
      frontend:
        condition: service_started
      backend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    command: ["/bin/sh", "/app/docker/run-caddy.sh"]
    volumes:
      - ./:/app:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ebill
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M
        reservations:
          memory: 64M

volumes:
  mongo_data:
    driver: local
  caddy_data:
  caddy_config:

networks:
  ebill:
    driver: bridge
