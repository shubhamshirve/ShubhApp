version: '3.8'

# ============================================================================
# eBill Docker Compose - Production Environment
# ============================================================================
# Features:
#   - Optimized resource limits
#   - Production-grade logging
#   - Security-focused configuration
#   - No debug endpoints
#   - Automatic restart on failure
# ============================================================================

services:
  # Initialize critical environment variables
  init-env:
    image: alpine:3.20
    container_name: ebill_init_env
    restart: "no"
    working_dir: /app
    environment:
      DOMAIN: ${DOMAIN}
      SERVER_IP: ${SERVER_IP}
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      BACKUP_PASSWORD: ${BACKUP_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
    command: ["/bin/sh", "/app/docker/init-env.sh", "/app"]
    volumes:
      - ./:/app
    networks:
      - ebill
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64M

  # MongoDB - Database (Production)
  mongodb:
    image: mongo:4.4
    container_name: ebill_mongodb
    restart: always
    depends_on:
      init-env:
        condition: service_completed_successfully
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"  # Bind to localhost only, accessed via backend on same network
    volumes:
      - mongo_data:/data/db
    networks:
      - ebill
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 1024M
        reservations:
          cpus: "0.1"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # FastAPI Backend (Production)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BUILD_ENV: production  # Use requirements.txt (production only)
    image: ${DOCKER_USERNAME:-teasyservices}/ebill-backend:${VERSION:-latest}
    container_name: ebill_backend
    restart: always
    depends_on:
      init-env:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    environment:
      DB_NAME: ${DB_NAME:-saas_db}
      # Authenticated MongoDB URI for production
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${DB_NAME:-saas_db}?authSource=admin
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
    expose:
      - "8000"
    networks:
      - ebill
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 1024M
        reservations:
          cpus: "0.1"
          memory: 256M
    labels:
      - "com.example.description=FastAPI backend service"
      - "com.example.version=${VERSION:-latest}"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # React Frontend (Production)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
    image: ${DOCKER_USERNAME:-teasyservices}/ebill-frontend:${VERSION:-latest}
    container_name: ebill_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - ebill
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M
    labels:
      - "com.example.description=React frontend service"
      - "com.example.version=${VERSION:-latest}"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # Caddy Web Server (Production)
  caddy:
    image: caddy:2.8-alpine
    container_name: ebill_caddy
    restart: always
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ebill
    environment:
      DOMAIN: ${DOMAIN}
      SERVER_IP: ${SERVER_IP}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    labels:
      - "com.example.description=Caddy reverse proxy (production)"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

volumes:
  mongo_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  ebill:
    driver: bridge
