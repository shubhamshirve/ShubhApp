
services:
  init-env:
    image: alpine:3.20
    container_name: ebill_init_env
    restart: "no"
    working_dir: /workspace
    command: ["/bin/sh", "/workspace/docker/init-env.sh"]
    volumes:
      - ./:/workspace
    networks:
      - ebill

  mongodb:
    image: mongo:4.4
    container_name: ebill_mongodb
    restart: unless-stopped
    depends_on:
      init-env:
        condition: service_completed_successfully
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change-this-mongo-password}
    ports:
      - "${MONGO_BIND_ADDRESS:-127.0.0.1}:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ebill

  backend:
    build:
      context: ./backend
    container_name: ebill_backend
    restart: unless-stopped
    depends_on:
      init-env:
        condition: service_completed_successfully
      mongodb:
        condition: service_started
    environment:
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-change-this-mongo-password}@mongodb:27017/${DB_NAME:-saas_db}?authSource=admin
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-change-this-mongo-password}@mongodb:27017/${DB_NAME:-saas_db}?authSource=admin
      DB_NAME: ${DB_NAME:-saas_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN:-localhost},http://${DOMAIN:-localhost}}
    expose:
      - "8000"
    networks:
      - ebill

  seed:
    build:
      context: ./backend
    container_name: ebill_seed
    restart: "no"
    depends_on:
      init-env:
        condition: service_completed_successfully
      mongodb:
        condition: service_started
    environment:
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-change-this-mongo-password}@mongodb:27017/${DB_NAME:-saas_db}?authSource=admin
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-change-this-mongo-password}@mongodb:27017/${DB_NAME:-saas_db}?authSource=admin
      DB_NAME: ${DB_NAME:-saas_db}
    command:
      - python
      - -c
      - |
        import asyncio
        import json
        from server import seed_data

        result = asyncio.run(seed_data())
        print(json.dumps(result, indent=2))
    networks:
      - ebill
    profiles:
      - tools

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-}
    container_name: ebill_frontend
    restart: unless-stopped
    depends_on:
      init-env:
        condition: service_completed_successfully
      backend:
        condition: service_started
    expose:
      - "3000"
    networks:
      - ebill

  caddy:
    image: caddy:2.8-alpine
    container_name: ebill_caddy
    restart: unless-stopped
    depends_on:
      init-env:
        condition: service_completed_successfully
      frontend:
        condition: service_started
      backend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      SERVER_IP: ${SERVER_IP:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ebill

volumes:
  mongo_data:
  caddy_data:
  caddy_config:

networks:
  ebill:
    driver: bridge
