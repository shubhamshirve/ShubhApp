
services:
  init-env:
    image: alpine:3.20
    container_name: ebill_init_env
    restart: "no"
    working_dir: /workspace
    command: ["/bin/sh", "/workspace/docker/init-env.sh"]
    volumes:
      - ./:/workspace
    networks:
      - ebill

  mongodb:
    image: mongo:4.4
    container_name: ebill_mongodb
    restart: unless-stopped
    depends_on:
      init-env:
        condition: service_completed_successfully
    volumes:
      - mongo_data:/data/db
    networks:
      - ebill

  backend:
    build:
      context: ./backend
    container_name: ebill_backend
    restart: unless-stopped
    depends_on:
      init-env:
        condition: service_completed_successfully
      mongodb:
        condition: service_started
    environment:
      MONGO_URL: mongodb://mongodb:27017/${DB_NAME:-saas_db}
      MONGO_URI: mongodb://mongodb:27017/${DB_NAME:-saas_db}
      DB_NAME: ${DB_NAME:-saas_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN:-localhost},http://${DOMAIN:-localhost}}
    expose:
      - "8000"
    networks:
      - ebill

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-}
    container_name: ebill_frontend
    restart: unless-stopped
    depends_on:
      init-env:
        condition: service_completed_successfully
      backend:
        condition: service_started
    expose:
      - "3000"
    networks:
      - ebill

  caddy:
    image: caddy:2.8-alpine
    container_name: ebill_caddy
    restart: unless-stopped
    depends_on:
      init-env:
        condition: service_completed_successfully
      frontend:
        condition: service_started
      backend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      SERVER_IP: ${SERVER_IP:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ebill

volumes:
  mongo_data:
  caddy_data:
  caddy_config:

networks:
  ebill:
    driver: bridge
