<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#004080"/>
  <!-- Letter E: vertical bar -->
  <rect x="13" y="14" width="9" height="36" rx="2" fill="white"/>
  <!-- Top horizontal bar -->
  <rect x="13" y="14" width="31" height="9" rx="2" fill="white"/>
  <!-- Middle horizontal bar (green accent) -->
  <rect x="13" y="27.5" width="25" height="9" rx="2" fill="#44AB62"/>
  <!-- Bottom horizontal bar -->
  <rect x="13" y="41" width="31" height="9" rx="2" fill="white"/>
  <!-- Green dot accent top-right -->
  <circle cx="50" cy="14" r="6" fill="#44AB62"/>
</svg>
